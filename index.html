<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template-Based Matrix Multiplier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #13171c;
      --line: #252b33;
      --text: #e6e9ee;
      --muted: #8a94a3;
      --accent: #f5b342;
      --accent-2: #5cc8ff;
      --error: #ff6b6b;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Space Grotesk", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(245,179,66,.08), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(92,200,255,.07), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }
    main { max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; }
    header { margin-bottom: 36px; }
    .tag {
      font-family: var(--mono); font-size: 13px; color: var(--accent);
      letter-spacing: .04em;
    }
    h1 { font-size: clamp(28px, 5vw, 48px); margin: 8px 0 8px; letter-spacing: -.02em; }
    header p { color: var(--muted); max-width: 640px; margin: 0; line-height: 1.5; }

    .controls {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: end;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 20px; margin-bottom: 24px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    select, input[type="number"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 14px;
    }
    .dims input { width: 64px; }
    button {
      font-family: var(--sans); font-weight: 500; font-size: 14px; cursor: pointer;
      border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line);
      background: transparent; color: var(--text);
    }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 700; }
    button.primary:hover { filter: brightness(1.08); }
    .spacer { flex: 1; }

    .stage {
      display: grid; grid-template-columns: auto auto auto auto auto;
      align-items: center; justify-content: start; gap: 18px; overflow-x: auto;
      padding-bottom: 8px;
    }
    .op { font-family: var(--mono); font-size: 28px; color: var(--muted); }
    .matrix-box h2 {
      font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted);
      margin: 0 0 8px;
    }
    .matrix-box h2 span { color: var(--accent-2); }
    .matrix {
      display: grid; gap: 4px; padding: 10px 12px; position: relative;
      border-left: 2px solid var(--text); border-right: 2px solid var(--text);
      border-radius: 6px;
    }
    .matrix input, .matrix .cell {
      width: 64px; height: 38px; text-align: center; padding: 0 4px;
      font-family: var(--mono); font-size: 14px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
    }
    .matrix input:focus { outline: none; border-color: var(--accent); }
    .matrix .cell {
      display: flex; align-items: center; justify-content: center;
      background: rgba(245,179,66,.08); border-color: rgba(245,179,66,.3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .matrix .cell.empty { background: var(--panel); border-color: var(--line); color: var(--muted); }

    .message { font-family: var(--mono); font-size: 13px; min-height: 20px; margin: 16px 0; color: var(--muted); }
    .message.error { color: var(--error); }

    .code {
      margin-top: 32px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
    }
    .code-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    pre {
      margin: 0; padding: 16px; overflow-x: auto;
      font-family: var(--mono); font-size: 13px; line-height: 1.6; color: #c9d1d9;
    }
    .kw { color: #ff7b72; } .ty { color: var(--accent-2); } .cm { color: #6e7681; } .nm { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="tag">template&lt;typename T, size_t R, size_t C&gt;</div>
      <h1>Template-Based Matrix Multiplier</h1>
      <p>Multiply two matrices of any compatible size and element type. The inner dimensions must match: an
        <strong>R×N</strong> matrix times an <strong>N×C</strong> matrix gives an <strong>R×C</strong> result.</p>
    </header>

    <section class="controls">
      <div class="field">
        <label for="type">element type T</label>
        <select id="type">
          <option value="int">int</option>
          <option value="double" selected>double</option>
          <option value="float">float</option>
        </select>
      </div>
      <div class="field dims">
        <label>A rows × cols</label>
        <div><input id="aRows" type="number" min="1" max="8" value="2" /> × <input id="aCols" type="number" min="1" max="8" value="3" /></div>
      </div>
      <div class="field dims">
        <label>B rows × cols</label>
        <div><input id="bRows" type="number" min="1" max="8" value="3" /> × <input id="bCols" type="number" min="1" max="8" value="2" /></div>
      </div>
      <div class="spacer"></div>
      <button id="random">Randomize</button>
      <button id="clear">Clear</button>
      <button id="multiply" class="primary">Multiply</button>
    </section>

    <section class="stage">
      <div class="matrix-box"><h2>A <span id="aLabel"></span></h2><div id="matA" class="matrix"></div></div>
      <div class="op">×</div>
      <div class="matrix-box"><h2>B <span id="bLabel"></span></h2><div id="matB" class="matrix"></div></div>
      <div class="op">=</div>
      <div class="matrix-box"><h2>C <span id="cLabel"></span></h2><div id="matC" class="matrix"></div></div>
    </section>

    <div id="message" class="message"></div>

    <section class="code">
      <div class="code-head"><span>matrix.hpp — equivalent C++ template</span><button id="copy">Copy</button></div>
      <pre id="code"></pre>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const MAX = 8;

    function clampDim(input) {
      const v = Math.min(MAX, Math.max(1, parseInt(input.value, 10) || 1));
      input.value = v;
      return v;
    }

    function readMatrix(el) {
      return [...el.querySelectorAll("input")].reduce((rows, input) => {
        const r = +input.dataset.r;
        (rows[r] ||= []).push(input.value);
        return rows;
      }, []);
    }

    function renderInputs(el, rows, cols, prev = []) {
      el.style.gridTemplateColumns = `repeat(${cols}, auto)`;
      el.innerHTML = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "decimal";
          input.dataset.r = r;
          input.value = prev[r]?.[c] ?? "0";
          input.addEventListener("input", multiply);
          el.appendChild(input);
        }
      }
    }

    function renderResult(rows, cols, data) {
      const el = $("matC");
      el.style.gridTemplateColumns = `repeat(${cols}, auto)`;
      el.innerHTML = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement("div");
          cell.className = "cell" + (data ? "" : " empty");
          cell.textContent = data ? formatValue(data[r][c]) : "?";
          if (data) cell.title = String(data[r][c]);
          el.appendChild(cell);
        }
      }
    }

    function parseValue(raw, type) {
      const s = String(raw).trim();
      if (s === "" || isNaN(Number(s))) return null;
      const n = Number(s);
      if (type === "int") return Math.trunc(n);
      if (type === "float") return Math.fround(n);
      return n;
    }

    function formatValue(v) {
      const type = $("type").value;
      if (type === "int") return String(v);
      return Number.isInteger(v) ? v.toFixed(1) : String(+v.toPrecision(type === "float" ? 7 : 10));
    }

    function setMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").className = "message" + (isError ? " error" : "");
    }

    function rebuild() {
      const [ar, ac, br, bc] = ["aRows", "aCols", "bRows", "bCols"].map((id) => clampDim($(id)));
      renderInputs($("matA"), ar, ac, readMatrix($("matA")));
      renderInputs($("matB"), br, bc, readMatrix($("matB")));
      $("aLabel").textContent = `${ar}×${ac}`;
      $("bLabel").textContent = `${br}×${bc}`;
      multiply();
    }

    function multiply() {
      const type = $("type").value;
      const ar = +$("aRows").value, ac = +$("aCols").value;
      const br = +$("bRows").value, bc = +$("bCols").value;
      $("cLabel").textContent = `${ar}×${bc}`;
      renderCode(type, ar, ac, bc);

      if (ac !== br) {
        renderResult(ar, bc, null);
        setMessage(`error: inner dimensions differ (A has ${ac} columns, B has ${br} rows) — this would not compile.`, true);
        return;
      }

      const parse = (m) => m.map((row) => row.map((v) => parseValue(v, type)));
      const A = parse(readMatrix($("matA")));
      const B = parse(readMatrix($("matB")));
      if ([...A.flat(), ...B.flat()].some((v) => v === null)) {
        renderResult(ar, bc, null);
        setMessage("error: every cell must contain a number.", true);
        return;
      }

      const C = Array.from({ length: ar }, (_, i) =>
        Array.from({ length: bc }, (_, j) => {
          let sum = 0;
          for (let k = 0; k < ac; k++) {
            sum += A[i][k] * B[k][j];
            if (type === "int") sum = Math.trunc(sum) | 0;
            else if (type === "float") sum = Math.fround(sum);
          }
          return sum;
        })
      );
      renderResult(ar, bc, C);
      setMessage(`ok: Matrix<${type}, ${ar}, ${ac}> × Matrix<${type}, ${br}, ${bc}> → Matrix<${type}, ${ar}, ${bc}>`);
    }

    function randomize() {
      const type = $("type").value;
      document.querySelectorAll("#matA input, #matB input").forEach((input) => {
        const n = Math.floor(Math.random() * 19) - 9;
        input.value = type === "int" ? n : (n + Math.round(Math.random() * 10) / 10).toFixed(1);
      });
      multiply();
    }

    function clearAll() {
      document.querySelectorAll("#matA input, #matB input").forEach((input) => (input.value = "0"));
      multiply();
    }

    function renderCode(type, r, n, c) {
      const code = `<span class="kw">#include</span> &lt;array&gt;
<span class="kw">#include</span> &lt;cstddef&gt;

<span class="kw">template</span> &lt;<span class="kw">typename</span> <span class="ty">T</span>, <span class="ty">std::size_t</span> R, <span class="ty">std::size_t</span> C&gt;
<span class="kw">struct</span> <span class="ty">Matrix</span> {
    <span class="ty">std::array</span>&lt;<span class="ty">std::array</span>&lt;<span class="ty">T</span>, C&gt;, R&gt; data{};

    <span class="ty">T</span>&amp;       <span class="kw">operator</span>()(<span class="ty">std::size_t</span> i, <span class="ty">std::size_t</span> j)       { <span class="kw">return</span> data[i][j]; }
    <span class="ty">const T</span>&amp; <span class="kw">operator</span>()(<span class="ty">std::size_t</span> i, <span class="ty">std::size_t</span> j) <span class="kw">const</span> { <span class="kw">return</span> data[i][j]; }
};

<span class="cm">// Inner dimension N must match — mismatches fail at compile time.</span>
<span class="kw">template</span> &lt;<span class="kw">typename</span> <span class="ty">T</span>, <span class="ty">std::size_t</span> R, <span class="ty">std::size_t</span> N, <span class="ty">std::size_t</span> C&gt;
<span class="ty">Matrix</span>&lt;<span class="ty">T</span>, R, C&gt; <span class="kw">operator</span>*(<span class="kw">const</span> <span class="ty">Matrix</span>&lt;<span class="ty">T</span>, R, N&gt;&amp; a, <span class="kw">const</span> <span class="ty">Matrix</span>&lt;<span class="ty">T</span>, N, C&gt;&amp; b) {
    <span class="ty">Matrix</span>&lt;<span class="ty">T</span>, R, C&gt; out;
    <span class="kw">for</span> (<span class="ty">std::size_t</span> i = <span class="nm">0</span>; i &lt; R; ++i)
        <span class="kw">for</span> (<span class="ty">std::size_t</span> j = <span class="nm">0</span>; j &lt; C; ++j)
            <span class="kw">for</span> (<span class="ty">std::size_t</span> k = <span class="nm">0</span>; k &lt; N; ++k)
                out(i, j) += a(i, k) * b(k, j);
    <span class="kw">return</span> out;
}

<span class="cm">// Current configuration:</span>
<span class="cm">// Matrix&lt;${type}, ${r}, ${n}&gt; A;  Matrix&lt;${type}, ${+$("bRows").value}, ${c}&gt; B;</span>
<span class="cm">// auto C = A * B;  // Matrix&lt;${type}, ${r}, ${c}&gt;</span>`;
      $("code").innerHTML = code;
    }

    ["aRows", "aCols", "bRows", "bCols"].forEach((id) => $(id).addEventListener("change", rebuild));
    $("type").addEventListener("change", multiply);
    $("multiply").addEventListener("click", multiply);
    $("random").addEventListener("click", randomize);
    $("clear").addEventListener("click", clearAll);
    $("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("code").textContent);
      $("copy").textContent = "Copied";
      setTimeout(() => ($("copy").textContent = "Copy"), 1200);
    });

    rebuild();
    randomize();
  </script>
</body>
</html>
